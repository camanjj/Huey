name: Release

# Cutting a release is manual and owner-only: workflow_dispatch can only be
# triggered by users with write access, and the guard step below narrows that
# to the repository owner alone.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increment"
        type: choice
        options:
          - patch
          - minor
          - major
        default: minor
      version:
        description: "Explicit version (X.Y.Z). Overrides the bump choice."
        type: string
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Verify actor is the repository owner
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ]; then
            echo "::error::Releases may only be cut by the repository owner ($OWNER); $ACTOR is not." >&2
            exit 1
          fi

      # Always release what is on main, even when dispatched from another branch.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Only bare X.Y.Z tags that are reachable from main count as releases:
          # a stray `build-42`, a pre-release, or a higher tag cut on some other
          # branch must not drive main's version arithmetic.
          latest=$(git tag --list --merged HEAD \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1 || true)
          latest=${latest:-0.0.0}
          echo "Latest release tag on main: $latest"

          if [ -n "$EXPLICIT" ]; then
            if ! printf '%s' "$EXPLICIT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Explicit version '$EXPLICIT' is not of the form X.Y.Z." >&2
              exit 1
            fi
            next="$EXPLICIT"
          else
            IFS=. read -r major minor patch <<<"$latest"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "::error::Unknown bump '$BUMP'." >&2; exit 1 ;;
            esac
            next="${major}.${minor}.${patch}"
          fi

          echo "Next version: $next"
          echo "version=$next" >>"$GITHUB_OUTPUT"
          echo "previous=$latest" >>"$GITHUB_OUTPUT"

      # Tagging and publishing cannot be one atomic act, so a run that pushed a
      # tag and then failed to publish leaves main tagged with no release. That
      # state is repairable rather than terminal: a rerun finishes the job.
      - name: Plan the release
        id: plan
        env:
          NEXT: ${{ steps.version.outputs.version }}
          EXPLICIT: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          head_tag=$(git tag --points-at HEAD \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1 || true)

          if [ -n "$head_tag" ]; then
            if gh release view "$head_tag" >/dev/null 2>&1; then
              echo "::error::main is already released as $head_tag; nothing new to tag." >&2
              exit 1
            fi
            if [ -n "$EXPLICIT" ] && [ "$EXPLICIT" != "$head_tag" ]; then
              echo "::error::main is already tagged $head_tag but its release is missing. Rerun with version '$head_tag', or with no explicit version, to publish it." >&2
              exit 1
            fi
            echo "::notice::Tag $head_tag already points at main and has no release; publishing it."
            echo "version=$head_tag" >>"$GITHUB_OUTPUT"
            echo "tag_needed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/$NEXT" >/dev/null \
            || [ -n "$(git ls-remote --tags origin "refs/tags/$NEXT")" ]; then
            echo "::error::Tag $NEXT already exists." >&2
            exit 1
          fi

          echo "version=$NEXT" >>"$GITHUB_OUTPUT"
          echo "tag_needed=true" >>"$GITHUB_OUTPUT"

      # The checkout is a snapshot; main can advance while this run is in flight.
      # Refuse to tag a commit that is no longer main's tip rather than quietly
      # releasing something older than "the latest changes on main".
      - name: Verify main has not moved
        if: steps.plan.outputs.tag_needed == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          head=$(git rev-parse HEAD)
          tip=$(git rev-parse FETCH_HEAD)
          if [ "$head" != "$tip" ]; then
            echo "::error::main advanced from $head to $tip while this run was in flight; rerun to release the newer commit." >&2
            exit 1
          fi

      - name: Tag main
        if: steps.plan.outputs.tag_needed == 'true'
        env:
          NEXT: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "Release $NEXT"
          git push origin "refs/tags/$NEXT"

      - name: Publish release
        env:
          NEXT: ${{ steps.plan.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse "refs/tags/$NEXT^{commit}")
          gh release create "$NEXT" \
            --target "$commit" \
            --title "$NEXT" \
            --generate-notes
          {
            echo "## Released \`$NEXT\`"
            echo
            echo "- Previous: \`$PREVIOUS\`"
            echo "- Commit: \`$commit\`"
          } >>"$GITHUB_STEP_SUMMARY"
